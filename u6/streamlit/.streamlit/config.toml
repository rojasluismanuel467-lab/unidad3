[theme]
base = "light"
primaryColor = "#1f2937"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#111827"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
